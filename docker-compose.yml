services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sigis}
      DB_USER: ${DB_USER:-sigis}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
    volumes:
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?defina DB_ROOT_PASS no .env}
      MYSQL_DATABASE: ${DB_NAME:-sigis}
      MYSQL_USER: ${DB_USER:-sigis}
      MYSQL_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
      SEED_TESTE: ${SEED_TESTE:-0}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/import_instituicoes_nn_2026.sql:/docker-entrypoint-initdb.d/02_instituicoes.sql
      - ./database/docker-seed-teste.sh:/docker-entrypoint-initdb.d/03_seed_dados_teste.sh
      - ./database/seed_dados_teste.sql:/seed-dados-teste.sql:ro
      - ./database/mysql-charset.cnf:/etc/mysql/conf.d/charset.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
