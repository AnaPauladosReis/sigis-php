# Regras de acesso aplicadas no Apache (nao dependem de .htaccess, ja que
# php:8.2-apache usa AllowOverride None por padrao).

<Directory "/var/www/html">
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/config">
    Require all denied
</Directory>

<Directory "/var/www/html/includes">
    Require all denied
</Directory>

<Directory "/var/www/html/uploads">
    <FilesMatch "\.(php|phtml|phar|php\d)$">
        Require all denied
    </FilesMatch>
    php_admin_flag engine off
</Directory>
